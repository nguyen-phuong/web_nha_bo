<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Thu Chi – Shop Quần Áo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --ink:#1E2A3A;
    --ink-soft:#4A5568;
    --gold:#B8863B;
    --gold-soft:#E8D5AE;
    --thu:#2F7D4F;
    --thu-bg:#E4F2E9;
    --chi:#B54834;
    --chi-bg:#F7E7E2;
    --paper:#F5F1E6;
    --paper-card:#FFFDF8;
    --line:#DCD3BE;
    --shadow: 0 2px 10px rgba(30,42,58,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(30,42,58,0.05) 1px, transparent 0);
    background-size: 18px 18px;
  }
  .app{max-width:720px;margin:0 auto;padding:0 0 90px;}

  /* ---------- Sticky header + tabs (stay put while content scrolls) ---------- */
  .sticky-top{
    position:sticky; top:0; z-index:30;
    background:var(--paper);
    max-width:720px; margin:0 auto;
  }

  /* Laptop / wider screens: give the app a bit more breathing room */
  @media (min-width:900px){
    .app{max-width:820px;}
    .sticky-top{max-width:820px;}
  }
  /* Laptop / desktop: use the extra width instead of leaving it empty */
  .grid-log{display:block;}
  .grid-2{display:block;}
  @media (min-width:1180px){
    .app{max-width:1400px;}
    .sticky-top{max-width:1400px;}
    .grid-log{display:grid; grid-template-columns:420px 1fr; gap:18px; align-items:start;}
    .grid-log .card{margin-bottom:0;}
    .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
    .grid-2 .card{margin-bottom:0;}
    /* less wasted side margin now that the container itself is wider */
    .tabs{padding:0 8px 14px;}
    section.panel{padding:0 8px;}
    .ticket{margin:0 8px 12px;}
    header{padding:22px 12px 26px;}
  }
  @media (min-width:1600px){
    .app{max-width:1600px;}
    .sticky-top{max-width:1600px;}
  }
  /* Small phones: tighten side padding a touch */
  @media (max-width:380px){
    .card{padding:14px;}
  }

  /* ---------- Header ---------- */
  header{
    background:var(--ink);
    color:var(--paper-card);
    padding:22px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:14px;
    background-image: radial-gradient(circle at 10px 0, var(--paper) 9px, transparent 10px);
    background-size: 20px 14px;
    background-repeat: repeat-x;
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold-soft); margin:0 0 4px;
  }
  header h1{
    font-family:'Fraunces',serif; font-weight:700; font-size:26px; margin:0;
  }
  .header-top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px;}
  .live-clock{
    font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600;
    color:var(--gold-soft); letter-spacing:1px; white-space:nowrap; padding-bottom:2px;
  }

  /* ---------- Ticket summary card ---------- */
  .ticket{
    background:var(--paper-card);
    margin:0 16px 12px;
    border-radius:8px;
    box-shadow:0 4px 16px rgba(184,134,59,0.18);
    padding:16px 18px 14px;
    position:relative;
    border:2px solid var(--gold);
  }
  .ticket-block + .ticket-block{margin-top:2px;}
  .ticket-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .ticket-row select{
    font-family:'IBM Plex Mono',monospace; font-size:13px; border:1px solid var(--line);
    background:transparent; border-radius:4px; padding:4px 6px; color:var(--ink);
  }
  .ticket-title{font-family:'Fraunces',serif; font-size:17px; font-weight:700; letter-spacing:.01em; color:var(--ink);}
  .ticket-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .ticket-cell{text-align:center;padding:9px 4px;border-radius:6px;}
  .ticket-cell .lbl{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .ticket-cell .val{font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:17px;}
  .ticket-cell.thu{background:var(--thu-bg);}
  .ticket-cell.thu .val{color:var(--thu);}
  .ticket-cell.chi{background:var(--chi-bg);}
  .ticket-cell.chi .val{color:var(--chi);}
  .ticket-cell.net .val{color:var(--ink);}
  .ticket-dash{border-top:2px dashed var(--gold-soft); margin:12px 0;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:6px; padding:0 16px 14px; overflow-x:auto;
  }
  .tab-btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--paper-card); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
    transition:.15s;
  }
  .tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  section.panel{padding:0 16px; display:none;}
  section.panel.active{display:block;}

  .card{
    background:var(--paper-card); border:1px solid var(--line); border-radius:8px;
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .card h2{
    font-family:'Fraunces',serif; font-size:17px; margin:0 0 12px; font-weight:600;
  }

  /* ---------- Form ---------- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .form-grid .full{grid-column:1 / -1;}
  label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
  input,select,textarea{
    width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field-warning{margin-top:5px; font-size:12px; color:#9C7A1E; font-weight:600;}

  .type-toggle{display:flex; gap:8px;}
  .type-toggle button{
    flex:1; padding:9px; border-radius:6px; border:1.5px solid var(--line); background:#fff;
    font-weight:700; cursor:pointer; font-size:14px; color:var(--ink-soft);
  }
  .type-toggle button.sel-thu{border-color:var(--thu); background:var(--thu-bg); color:var(--thu);}
  .type-toggle button.sel-chi{border-color:var(--chi); background:var(--chi-bg); color:var(--chi);}

  .btn-primary{
    margin-top:12px; width:100%; padding:11px; border:none; border-radius:6px;
    background:var(--gold); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary:hover{background:#a3762f;}
  .btn-secondary{
    padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:#fff;
    color:var(--ink-soft); font-weight:600; font-size:13px; cursor:pointer;
  }

  /* ---------- Transaction list ---------- */
  .filters{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .filters select, .filters input{width:auto; flex:1; min-width:110px;}

  .txn{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--line);
    border-left:4px solid var(--thu);
  }
  .txn.chi{border-left-color:var(--chi);}
  .txn .txn-main{flex:1; min-width:0;}
  .txn .txn-desc{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .txn .txn-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .txn .txn-amt{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; white-space:nowrap;}
  .txn .txn-amt.thu{color:var(--thu);}
  .txn .txn-amt.chi{color:var(--chi);}
  .txn .txn-actions{display:flex; gap:4px;}
  .icon-btn{
    border:none; background:transparent; cursor:pointer; padding:5px; border-radius:5px; color:var(--ink-soft);
  }
  .icon-btn:hover{background:var(--paper);}
  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}

  /* ---------- Tables ---------- */
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:right; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-soft); padding:6px 6px; border-bottom:2px solid var(--line);
  }
  th:first-child, td:first-child{text-align:left;}
  td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:right; font-family:'IBM Plex Mono',monospace;}
  td:first-child{font-family:'Inter',sans-serif; font-weight:600;}
  tr.max-row td{background:var(--chi-bg);}
  tr.total-row td{font-weight:700; border-top:2px solid var(--ink); border-bottom:none;}

  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px;}
  .month-group{padding:6px 8px; border-radius:8px; margin-bottom:4px;}
  .month-group.current{background:var(--gold-soft); box-shadow:0 0 0 2px var(--gold) inset;}
  .month-group.current .bar-row{margin-bottom:6px;}

  /* ---------- Donut charts (Overview tab) ---------- */
  .donut-row{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .donut-legend{flex:1; min-width:160px; display:flex; flex-direction:column; gap:8px;}
  .legend-item{font-size:13px; color:var(--ink); display:flex; align-items:center; gap:7px;}
  .legend-item .dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
  .legend-item .dot.thu{background:var(--thu);}
  .legend-item .dot.chi{background:var(--chi);}
  .legend-item.net{margin-top:4px; padding-top:8px; border-top:1px dashed var(--line); font-size:14px;}

  /* ---------- Vertical column chart (Thu/Chi/Chênh lệch per month) ---------- */
  .col-chart-legend{display:flex; gap:16px; margin-bottom:14px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap;}
  .col-chart-legend .legend-item{display:flex; align-items:center; gap:5px; margin:0; padding:0; border:none; font-size:12px;}
  .col-chart{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 10px; align-items:flex-end;}
  .col-month{display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; padding:6px 8px 4px; border-radius:8px;}
  .col-month.current{background:var(--gold-soft); box-shadow:0 0 0 2px var(--gold) inset;}
  .col-bars{display:flex; align-items:flex-end; gap:5px;}
  .col-bar-wrap{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:168px; gap:4px;}
  .col-bar-label{font-size:9px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); white-space:nowrap;}
  .col-bar{width:16px; border-radius:3px 3px 0 0; transition:height .2s;}
  .col-bar.thu{background:var(--thu);}
  .col-bar.chi{background:var(--chi);}
  .col-bar.net{background:var(--gold);}
  .col-month-label{font-size:11px; color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  .legend-item .dot.net{background:var(--gold);}
  .bar-label{width:64px; flex-shrink:0; color:var(--ink-soft);}
  .bar-track{flex:1; background:var(--paper); border-radius:4px; overflow:hidden; height:16px; display:flex;}
  .bar-fill{height:100%; border-radius:4px;}
  .bar-fill.thu{background:var(--thu);}
  .bar-fill.chi{background:var(--chi);}

  /* ---------- chips (danh mục) ---------- */
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:5px 6px 5px 12px; font-size:13px;
  }
  .chip button{border:none;background:transparent;cursor:pointer;color:var(--ink-soft);font-size:14px;line-height:1;padding:2px 4px;}
  .add-row{display:flex; gap:8px;}
  .add-row input{flex:1;}

  .muted{color:var(--ink-soft); font-size:12px; margin-top:6px;}
  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:.25s; z-index:50;
  }
  .toast.show{opacity:1;}

  @media (max-width:400px){
    .form-grid{grid-template-columns:1fr;}
  }

  /* ---------- Date picker (custom, Vietnamese) ---------- */
  .date-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; text-align:left; cursor:pointer; background:#fff;
    font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; color:var(--ink);
  }
  .date-btn:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .date-btn svg{flex-shrink:0; color:var(--ink-soft);}
  .cal-overlay{
    position:fixed; inset:0; background:rgba(30,42,58,0.45); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .cal-modal{
    background:#fff; border-radius:10px; padding:14px; width:100%; max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .cal-head{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:10px;}
  .cal-head select{
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px; border:1px solid var(--line);
    border-radius:6px; padding:5px 6px; background:#fff; color:var(--ink);
  }
  .cal-nav-btn{
    border:none; background:var(--paper); border-radius:6px; width:30px; height:30px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .cal-nav-btn:hover{background:var(--gold-soft);}
  .cal-weekdays, .cal-days{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cal-weekdays div{
    text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); padding:4px 0;
  }
  .cal-day{
    text-align:center; padding:8px 0; border-radius:6px; font-size:13px; cursor:pointer; border:none; background:transparent; color:var(--ink);
  }
  .cal-day:hover{background:var(--paper);}
  .cal-day.other-month{color:#C7BFA9;}
  .cal-day.today{border:1.5px solid var(--gold);}
  .cal-day.selected{background:var(--ink); color:#fff; font-weight:700;}
  .cal-footer{display:flex; justify-content:space-between; margin-top:12px; gap:8px;}

  /* ---------- Import review modal ---------- */
  .modal-box{
    background:#fff; border-radius:10px; padding:20px; width:100%; max-width:480px;
    max-height:85vh; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .import-summary{display:flex; gap:10px; margin-bottom:16px;}
  .import-stat{flex:1; text-align:center; padding:10px 6px; border-radius:8px;}
  .import-stat .n{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:22px;}
  .import-stat .l{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .import-stat.ok{background:var(--thu-bg);} .import-stat.ok .n{color:var(--thu);}
  .import-stat.warn{background:#FFF6E0;} .import-stat.warn .n{color:#9C7A1E;}
  .import-stat.bad{background:var(--chi-bg);} .import-stat.bad .n{color:var(--chi);}
  .import-stat.dup{background:#E8E4F5;} .import-stat.dup .n{color:#5B4B9E;}
  .import-section-title{font-weight:700; font-size:13px; margin:14px 0 6px;}
  .import-list{max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin-bottom:4px;}
  .import-item{padding:8px 10px; font-size:12.5px; border-bottom:1px solid var(--line); line-height:1.5;}
  .import-item:last-child{border-bottom:none;}
  .import-item.bad{background:var(--chi-bg); color:#7A2A1D;}
  .import-item.warn{background:#FFF6E0; color:#6B5312;}
  .import-item.dup{background:#F1EEFA; color:#4A3D7A;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Đang tải dữ liệu…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const money = n => (n||0).toLocaleString('vi-VN') + ' ₫';
const todayISO = () => new Date().toISOString().slice(0,10);
const isFutureDate = (iso) => !!iso && iso > todayISO();
const uid = () => 'txn_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);

const VI_WEEKDAYS = ['CN','T2','T3','T4','T5','T6','T7'];
const VI_MONTHS = Array.from({length:12}, (_,i)=>`Tháng ${i+1}`);

function formatNumberInput(value){
  const digits = String(value).replace(/\D/g,'');
  if(!digits) return '';
  return Number(digits).toLocaleString('vi-VN');
}
function parseNumberInput(value){
  return Number(String(value).replace(/\D/g,'')) || 0;
}
function attachThousandSeparator(input){
  input.addEventListener('input', ()=>{
    const raw = parseNumberInput(input.value);
    input.value = raw ? raw.toLocaleString('vi-VN') : '';
  });
}

const DEFAULT_STATE = {
  transactions: [
    {id:uid(), date:'2026-08-01', type:'Thu', category:'Bán hàng', supplier:'', desc:'Bán áo thun + quần jean cho khách lẻ', amount:3500000, method:'Tiền mặt', note:'Khách quen'},
    {id:uid(), date:'2026-08-02', type:'Chi', category:'Nhập hàng', supplier:'Xưởng may Bình Tân', desc:'Nhập lô áo sơ mi mùa thu', amount:12000000, method:'Chuyển khoản', note:''},
    {id:uid(), date:'2026-08-03', type:'Chi', category:'Thuê mặt bằng', supplier:'', desc:'Tiền thuê cửa hàng tháng 8', amount:8000000, method:'Chuyển khoản', note:''},
    {id:uid(), date:'2026-08-05', type:'Thu', category:'Bán hàng', supplier:'', desc:'Bán hàng online qua Shopee', amount:4200000, method:'Chuyển khoản', note:'Đã trừ phí sàn'},
    {id:uid(), date:'2026-08-07', type:'Chi', category:'Nhập hàng', supplier:'Chợ đầu mối Ninh Hiệp', desc:'Nhập phụ kiện, túi xách', amount:6500000, method:'Tiền mặt', note:''},
  ],
  categories: {
    Thu: ['Bán hàng', 'Thu nợ khách hàng', 'Thu khác'],
    Chi: ['Nhập hàng', 'Thuê mặt bằng', 'Lương nhân viên', 'Điện nước, internet', 'Marketing', 'Vận chuyển', 'Bao bì đóng gói', 'Chi khác']
  },
  suppliers: ['Xưởng may Bình Tân', 'Chợ đầu mối Ninh Hiệp', 'Xưởng An Phát', 'Chợ sỉ Tân Bình']
};

function deepClone(obj){
  return JSON.parse(JSON.stringify(obj));
}

let state = null;
let activeTab = 'overview';
let editingId = null;
const STORAGE_KEY = 'cashflow-data-shop-quanao';

// Works two ways: window.storage when viewed inside Claude.ai, and the
// browser's own localStorage when the file is downloaded and opened
// directly (the normal way to use this as a long-term, multi-year app).
function hasClaudeStorage(){
  return typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function';
}
async function storageGetRaw(){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  try{ return localStorage.getItem(STORAGE_KEY); }
  catch(e){ return null; }
}
async function storageSetRaw(json){
  if(hasClaudeStorage()){
    await window.storage.set(STORAGE_KEY, json);
    return;
  }
  localStorage.setItem(STORAGE_KEY, json);
}

async function loadState(){
  let raw = null;
  try{ raw = await storageGetRaw(); }catch(e){ raw = null; }
  try{
    state = raw ? JSON.parse(raw) : deepClone(DEFAULT_STATE);
  }catch(e){
    state = deepClone(DEFAULT_STATE);
  }
  if(!state || !state.transactions) state = deepClone(DEFAULT_STATE);
  render();
}

// ---------------------------------------------------------------- EXCEL EXPORT/IMPORT
// Uses ExcelJS (unlike the free SheetJS build, it can write real cell colors
// and native Excel Tables), with the same column layout as the "Nhật ký thu
// chi" sheet in the Excel workbook, so files move freely between this app
// and that file.
const EXCEL_HEADERS = ["STT","Ngày","Loại (Thu/Chi)","Danh mục","Nhà cung cấp","Diễn giải","Số tiền (VNĐ)","Hình thức","Ghi chú"];
const EXCEL_SHEET_NAME = "Nhật ký thu chi";
const EXCEL_COLORS = {
  headerFill: 'FF1E2A3A', headerFont: 'FFFFFFFF',
  thuFill: 'FFE4F2E9', thuFont: 'FF1E6B3E',
  chiFill: 'FFF7E7E2', chiFont: 'FF9C3A29'
};

const EXCEL_BLANK_ROWS = 40; // extra pre-formatted empty rows for the user to type new transactions into

async function exportExcel(){
  if(typeof ExcelJS === 'undefined'){
    alert('Không tải được thư viện Excel. Vui lòng kiểm tra kết nối mạng rồi thử lại.');
    return;
  }
  const txns = state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const combinedCategories = [...new Set([...(state.categories.Thu||[]), ...(state.categories.Chi||[])])];
  const suppliers = state.suppliers || [];

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Sổ Thu Chi Shop';

  // ---- Helper sheet: backs the dropdown lists (also editable by the user) ----
  const wsCat = wb.addWorksheet('Danh mục');
  wsCat.columns = [{width:4},{width:24},{width:4},{width:26},{width:4},{width:26}];
  wsCat.getCell('B1').value = 'Loại';
  wsCat.getCell('D1').value = 'Danh mục';
  wsCat.getCell('F1').value = 'Nhà cung cấp';
  ['B1','D1','F1'].forEach(ref=>{ wsCat.getCell(ref).font = {bold:true, color:{argb:EXCEL_COLORS.headerFont}}; wsCat.getCell(ref).fill = {type:'pattern', pattern:'solid', fgColor:{argb:EXCEL_COLORS.headerFill}}; });
  ['Thu','Chi'].forEach((v,i)=> wsCat.getCell(`B${i+2}`).value = v);
  combinedCategories.forEach((v,i)=> wsCat.getCell(`D${i+2}`).value = v);
  suppliers.forEach((v,i)=> wsCat.getCell(`F${i+2}`).value = v);
  const catListMax = Math.max(20, combinedCategories.length + 10);
  const supListMax = Math.max(20, suppliers.length + 10);

  // ---- Main sheet ----
  const ws = wb.addWorksheet(EXCEL_SHEET_NAME, {views:[{state:'frozen', ySplit:1}]});
  ws.columns = [
    {width:5},{width:12},{width:14},{width:24},{width:20},{width:32},{width:15},{width:14},{width:22}
  ];

  const dataRows = txns.map((t,i)=>{
    const [y,m,d] = t.date.split('-').map(Number);
    return [i+1, new Date(y, m-1, d), t.type, t.category||'', t.supplier||'', t.desc||'', Number(t.amount)||0, t.method||'', t.note||''];
  });
  const blankRows = Array.from({length: EXCEL_BLANK_ROWS}, ()=> ['','','','','','','','','']);
  const tableRows = dataRows.concat(blankRows);
  const lastRow = 1 + tableRows.length; // header is row 1

  ws.addTable({
    name: 'BangThuChi',
    ref: 'A1',
    headerRow: true,
    totalsRow: false,
    style: { theme: 'TableStyleLight1', showRowStripes: false },
    columns: EXCEL_HEADERS.map(h => ({ name: h, filterButton: true })),
    rows: tableRows
  });

  // Header row styling
  const headerRow = ws.getRow(1);
  headerRow.eachCell(cell=>{
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:EXCEL_COLORS.headerFill}};
    cell.font = {bold:true, color:{argb:EXCEL_COLORS.headerFont}};
    cell.alignment = {vertical:'middle', horizontal:'center'};
  });
  headerRow.height = 20;

  // Column-wide formats/alignment (applies to blank rows too, so typed-in values inherit them)
  ws.getColumn(1).alignment = {horizontal:'center'};
  ws.getColumn(2).alignment = {horizontal:'center'};
  ws.getColumn(2).numFmt = 'dd/mm/yyyy';
  ws.getColumn(3).alignment = {horizontal:'center'};
  ws.getColumn(7).numFmt = '#,##0" ₫"';

  // Dropdowns (data validation) across every data + blank row, so typing new rows still gets them
  for(let r=2; r<=lastRow; r++){
    ws.getCell(`C${r}`).dataValidation = { type:'list', allowBlank:true, formulae:['"Thu,Chi"'], showErrorMessage:true, errorTitle:'Không hợp lệ', error:'Chỉ chọn Thu hoặc Chi' };
    ws.getCell(`D${r}`).dataValidation = { type:'list', allowBlank:true, formulae:[`'Danh mục'!$D$2:$D$${catListMax+1}`] };
    ws.getCell(`E${r}`).dataValidation = { type:'list', allowBlank:true, formulae:[`'Danh mục'!$F$2:$F$${supListMax+1}`] };
    ws.getCell(`H${r}`).dataValidation = { type:'list', allowBlank:true, formulae:['"Tiền mặt,Chuyển khoản,Thẻ,Khác"'] };
  }

  // Conditional formatting (row-wide, based on the "Loại" column) so ANY row — including
  // ones the user types into later — colors itself automatically: green for Thu, rust for Chi.
  ws.addConditionalFormatting({
    ref: `A2:I${lastRow}`,
    rules: [
      { type:'expression', priority:1, formulae:['$C2="Thu"'], style:{ fill:{type:'pattern', pattern:'solid', bgColor:{argb:EXCEL_COLORS.thuFill}} } },
      { type:'expression', priority:2, formulae:['$C2="Chi"'], style:{ fill:{type:'pattern', pattern:'solid', bgColor:{argb:EXCEL_COLORS.chiFill}} } }
    ]
  });
  ws.addConditionalFormatting({
    ref: `C2:C${lastRow}`,
    rules: [
      { type:'expression', priority:3, formulae:['$C2="Thu"'], style:{ font:{bold:true, color:{argb:EXCEL_COLORS.thuFont}} } },
      { type:'expression', priority:4, formulae:['$C2="Chi"'], style:{ font:{bold:true, color:{argb:EXCEL_COLORS.chiFont}} } }
    ]
  });
  ws.addConditionalFormatting({
    ref: `G2:G${lastRow}`,
    rules: [
      { type:'expression', priority:5, formulae:['$C2="Thu"'], style:{ font:{bold:true, color:{argb:EXCEL_COLORS.thuFont}} } },
      { type:'expression', priority:6, formulae:['$C2="Chi"'], style:{ font:{bold:true, color:{argb:EXCEL_COLORS.chiFont}} } }
    ]
  });

  // Legend note below the table + blank rows
  const legendStart = lastRow + 2;
  ws.getCell(`A${legendStart}`).value = 'Chú thích:';
  ws.getCell(`A${legendStart}`).font = {bold:true};
  ws.getCell(`A${legendStart+1}`).value = 'Thu';
  ws.getCell(`A${legendStart+1}`).fill = {type:'pattern', pattern:'solid', fgColor:{argb:EXCEL_COLORS.thuFill}};
  ws.getCell(`A${legendStart+1}`).font = {bold:true, color:{argb:EXCEL_COLORS.thuFont}};
  ws.getCell(`B${legendStart+1}`).value = 'Tiền vào (bán hàng, thu nợ...)';
  ws.getCell(`A${legendStart+2}`).value = 'Chi';
  ws.getCell(`A${legendStart+2}`).fill = {type:'pattern', pattern:'solid', fgColor:{argb:EXCEL_COLORS.chiFill}};
  ws.getCell(`A${legendStart+2}`).font = {bold:true, color:{argb:EXCEL_COLORS.chiFont}};
  ws.getCell(`B${legendStart+2}`).value = 'Tiền ra (nhập hàng, thuê nhà, lương...)';
  ws.getCell(`A${legendStart+4}`).value = `Có ${EXCEL_BLANK_ROWS} dòng trống đã kẻ sẵn trong bảng để bạn gõ thêm giao dịch mới. Nếu cần nhiều hơn, gõ tiếp vào dòng ngay dưới bảng — Excel sẽ tự mở rộng bảng.`;
  ws.getCell(`A${legendStart+4}`).font = {italic:true, color:{argb:'FF4A5568'}};
  ws.mergeCells(`A${legendStart+4}:I${legendStart+4}`);
  ws.getRow(legendStart+4).height = 30;
  ws.getCell(`A${legendStart+4}`).alignment = {wrapText:true, vertical:'middle'};

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `nhat-ky-thu-chi-${stamp}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Đã xuất file Excel');
}

function cellRawValue(v){
  if(v && typeof v === 'object'){
    if(v instanceof Date) return v;
    if('result' in v) return v.result;
    if('richText' in v) return v.richText.map(rt=>rt.text).join('');
    if('text' in v) return v.text;
  }
  return v;
}
function normalizeHeaderCell(h){
  return String(h==null? '' : h).trim().toLowerCase();
}
const EXCEL_FIELD_ALIASES = {
  date: ['ngày'],
  type: ['loại (thu/chi)','loại'],
  category: ['danh mục'],
  supplier: ['nhà cung cấp'],
  desc: ['diễn giải'],
  amount: ['số tiền (vnđ)','số tiền'],
  method: ['hình thức'],
  note: ['ghi chú']
};
function findHeaderRow(rows){
  for(let i=0; i<Math.min(rows.length, 10); i++){
    const cells = (rows[i]||[]).map(normalizeHeaderCell);
    if(cells.includes('ngày')) return i;
  }
  return -1;
}
function buildColumnMap(headerRow){
  const map = {};
  headerRow.forEach((cell, idx)=>{
    const norm = normalizeHeaderCell(cell);
    Object.keys(EXCEL_FIELD_ALIASES).forEach(key=>{
      if(EXCEL_FIELD_ALIASES[key].includes(norm) && !(key in map)) map[key] = idx;
    });
  });
  return map;
}
function parseExcelDateCell(val){
  if(val instanceof Date && !isNaN(val)){
    const y = val.getFullYear(), m = String(val.getMonth()+1).padStart(2,'0'), d = String(val.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof val === 'string'){
    const s = val.trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  }
  return null;
}
function parseExcelAmountCell(val){
  if(typeof val === 'number') return val;
  return Number(String(val==null?'':val).replace(/[^\d-]/g,'')) || 0;
}
function normalizeForSignature(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function txnSignature(t){
  return [
    t.date,
    t.type,
    Math.round(Number(t.amount)||0),
    normalizeForSignature(t.desc),
    normalizeForSignature(t.category),
    normalizeForSignature(t.supplier)
  ].join('|');
}
function validateExcelRow(r, colMap, rowNumber){
  const errors = [];
  const warnings = [];

  const dateRaw = r[colMap.date];
  const iso = parseExcelDateCell(dateRaw);
  if(!iso) errors.push('Ngày trống hoặc không đúng định dạng (cần dd/mm/yyyy hoặc ô ngày thật của Excel)');

  const typeRaw = colMap.type!==undefined ? String(r[colMap.type]||'').trim() : '';
  let type = null;
  if(!typeRaw) errors.push('Thiếu "Loại" (phải là Thu hoặc Chi)');
  else if(typeRaw!=='Thu' && typeRaw!=='Chi') errors.push(`"Loại" không hợp lệ: "${typeRaw}" (chỉ chấp nhận Thu hoặc Chi)`);
  else type = typeRaw;

  const amountRaw = r[colMap.amount];
  const amount = parseExcelAmountCell(amountRaw);
  if(amountRaw===undefined || amountRaw===null || amountRaw===''){
    errors.push('Thiếu "Số tiền"');
  } else if(!(amount > 0)){
    errors.push(`"Số tiền" không hợp lệ: "${amountRaw}" (phải là số lớn hơn 0)`);
  }

  const desc = colMap.desc!==undefined ? String(r[colMap.desc]||'').trim() : '';
  if(!desc) warnings.push('Chưa có "Diễn giải"');
  if(iso && isFutureDate(iso)) warnings.push(`Ngày ${formatDateVN(iso)} là ngày trong tương lai`);

  const category = colMap.category!==undefined ? String(r[colMap.category]||'').trim() : '';
  const supplier = colMap.supplier!==undefined ? String(r[colMap.supplier]||'').trim() : '';
  const method = colMap.method!==undefined ? String(r[colMap.method]||'').trim() : '';
  const note = colMap.note!==undefined ? String(r[colMap.note]||'').trim() : '';

  return {
    rowNumber, errors, warnings,
    data: errors.length===0 ? {id:uid(), date:iso, type, category, supplier, desc, amount, method, note} : null
  };
}

function getTableRowRange(ws){
  const tables = ws.tables || {};
  const name = tables['BangThuChi'] ? 'BangThuChi' : Object.keys(tables)[0];
  if(!name) return null;
  const ref = tables[name] && tables[name].table && tables[name].table.tableRef;
  if(!ref) return null;
  const m = ref.match(/^[A-Z]+(\d+):[A-Z]+(\d+)$/);
  if(!m) return null;
  return { startRow: parseInt(m[1],10), endRow: parseInt(m[2],10) };
}

async function importExcelFile(file){
  if(typeof ExcelJS === 'undefined'){
    alert('Không tải được thư viện Excel. Vui lòng kiểm tra kết nối mạng rồi thử lại.');
    return;
  }
  let buffer;
  try{ buffer = await file.arrayBuffer(); }
  catch(e){ alert('Không đọc được file này.'); return; }

  const wb = new ExcelJS.Workbook();
  try{ await wb.xlsx.load(buffer); }
  catch(e){ alert('Không đọc được file Excel này. Vui lòng kiểm tra lại file có đúng định dạng .xlsx không.'); return; }

  const ws = wb.getWorksheet(EXCEL_SHEET_NAME) || wb.worksheets[0];
  if(!ws){ alert('Không tìm thấy dữ liệu trong file Excel này.'); return; }

  const rows = [];
  ws.eachRow({includeEmpty:true}, (row, rowNumber)=>{
    const arr = [];
    row.eachCell({includeEmpty:true}, (cell, colNumber)=>{ arr[colNumber-1] = cellRawValue(cell.value); });
    rows[rowNumber-1] = arr;
  });

  const headerIdx = findHeaderRow(rows);
  if(headerIdx === -1){
    alert('Không tìm thấy dòng tiêu đề (cột "Ngày") trong file Excel. Vui lòng dùng đúng file đã xuất từ app này hoặc file mẫu.');
    return;
  }
  const colMap = buildColumnMap(rows[headerIdx]);
  if(colMap.date===undefined || colMap.amount===undefined){
    alert('Thiếu cột "Ngày" hoặc "Số tiền" trong file. Vui lòng kiểm tra lại tiêu đề các cột.');
    return;
  }

  // Only look inside the actual Excel Table's row range — anything below it
  // (legend/notes rows, stray text, etc.) is not transaction data and should
  // never be checked or reported as an error.
  const tableRange = getTableRowRange(ws);
  const lastRowIdx = tableRange ? Math.min(tableRange.endRow - 1, rows.length - 1) : rows.length - 1;

  const results = [];
  for(let i=headerIdx+1; i<=lastRowIdx; i++){
    const r = rows[i];
    if(!r || r.every(c=>c==='' || c==null || c===undefined)) continue; // skip fully blank template rows
    results.push(validateExcelRow(r, colMap, i+1)); // Excel row number (1-based, matches what user sees)
  }

  if(results.length===0){
    alert('Không tìm thấy dòng dữ liệu nào trong file (ngoài dòng tiêu đề).');
    return;
  }

  // Mark rows whose data exactly matches a transaction already in the app
  // (same date, type, amount, description, category, supplier) as duplicates,
  // so re-importing the same file — or overlapping data — doesn't pile up.
  const existingSignatures = new Set(state.transactions.map(txnSignature));
  const seenInThisFile = new Set();
  results.forEach(r=>{
    if(!r.data) return;
    const sig = txnSignature(r.data);
    if(existingSignatures.has(sig) || seenInThisFile.has(sig)){
      r.isDuplicate = true;
    } else {
      seenInThisFile.add(sig);
    }
  });

  openImportReviewModal(results);
}

function openImportReviewModal(results){
  const valid = results.filter(r=>r.errors.length===0);
  const invalid = results.filter(r=>r.errors.length>0);
  const duplicates = valid.filter(r=>r.isDuplicate);
  const newOnes = valid.filter(r=>!r.isDuplicate);
  const withWarnings = newOnes.filter(r=>r.warnings.length>0);

  const overlay = document.createElement('div');
  overlay.className = 'cal-overlay';
  overlay.id = 'import-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h2 style="margin-top:0;">Kết quả kiểm tra file Excel</h2>
      <div class="import-summary">
        <div class="import-stat ok"><div class="n">${newOnes.length}</div><div class="l">dòng mới, hợp lệ</div></div>
        <div class="import-stat dup"><div class="n">${duplicates.length}</div><div class="l">trùng dữ liệu cũ</div></div>
        <div class="import-stat bad"><div class="n">${invalid.length}</div><div class="l">dòng lỗi</div></div>
      </div>
      ${invalid.length>0 ? `
        <p class="import-section-title">⚠ Các dòng lỗi (sẽ KHÔNG được nhập):</p>
        <div class="import-list">
          ${invalid.map(r=>`<div class="import-item bad"><strong>Dòng ${r.rowNumber}:</strong> ${r.errors.map(escapeHtml).join('; ')}</div>`).join('')}
        </div>
      ` : ''}
      ${duplicates.length>0 ? `
        <p class="import-section-title">↺ Trùng dữ liệu đã có (tự động bỏ qua, không nhập lại):</p>
        <div class="import-list">
          ${duplicates.map(r=>`<div class="import-item dup"><strong>Dòng ${r.rowNumber}:</strong> ${formatDateVN(r.data.date)} · ${r.data.type} · ${money(r.data.amount)} · ${escapeHtml(r.data.desc||'(không có diễn giải)')}</div>`).join('')}
        </div>
      ` : ''}
      ${withWarnings.length>0 ? `
        <p class="import-section-title">ℹ Cảnh báo (vẫn sẽ được nhập):</p>
        <div class="import-list">
          ${withWarnings.map(r=>`<div class="import-item warn"><strong>Dòng ${r.rowNumber}:</strong> ${r.warnings.map(escapeHtml).join('; ')}</div>`).join('')}
        </div>
      ` : ''}
      ${newOnes.length===0 ? `<p class="muted">Không có dòng mới nào để nhập${duplicates.length?' — tất cả đều đã có trong dữ liệu hiện tại.':'.'}</p>` : ''}
      <div class="cal-footer">
        <button type="button" class="btn-secondary" id="import-cancel">Huỷ</button>
        ${newOnes.length>0 ? `<button type="button" class="btn-primary" id="import-confirm" style="margin-top:0;">Nhập ${newOnes.length} dòng mới</button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('import-cancel').onclick = ()=> overlay.remove();
  const confirmBtn = document.getElementById('import-confirm');
  if(confirmBtn){
    confirmBtn.onclick = ()=>{
      const imported = newOnes.map(r=>r.data);
      imported.forEach(t=>{
        if(t.category){
          const list = state.categories[t.type] || (state.categories[t.type]=[]);
          if(!list.includes(t.category)) list.push(t.category);
        }
        if(t.supplier && !state.suppliers.includes(t.supplier)) state.suppliers.push(t.supplier);
      });
      state.transactions = imported.concat(state.transactions);
      saveState();
      overlay.remove();
      render();
      showToast(`Đã nhập ${imported.length} giao dịch mới${duplicates.length?` (bỏ qua ${duplicates.length} dòng trùng)`:''}`);
    };
  }
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await storageSetRaw(JSON.stringify(state));
    }catch(e){
      showToast('Không lưu được dữ liệu — hãy dùng nút "Xuất dữ liệu" để sao lưu thủ công');
    }
  }, 150);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function monthYear(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return {m:d.getMonth()+1, y:d.getFullYear()};
}

function currentMonthTotals(){
  const now = new Date();
  const m = now.getMonth()+1, y = now.getFullYear();
  let thu=0, chi=0;
  state.transactions.forEach(t=>{
    const my = monthYear(t.date);
    if(my.m===m && my.y===y){
      if(t.type==='Thu') thu += Number(t.amount);
      else chi += Number(t.amount);
    }
  });
  return {thu, chi, net:thu-chi};
}
function currentYearTotals(){
  const y = new Date().getFullYear();
  let thu=0, chi=0;
  state.transactions.forEach(t=>{
    if(monthYear(t.date).y===y){
      if(t.type==='Thu') thu += Number(t.amount);
      else chi += Number(t.amount);
    }
  });
  return {thu, chi, net:thu-chi};
}

function allYears(){
  const ys = new Set(state.transactions.map(t=>monthYear(t.date).y));
  ys.add(new Date().getFullYear());
  return Array.from(ys).sort((a,b)=>b-a);
}

const VI_WEEKDAYS_FULL = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function formatFullDateVN(d){
  const pad = n => String(n).padStart(2,'0');
  return `${VI_WEEKDAYS_FULL[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function formatTimeVN(d){
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ---------------------------------------------------------------- DATE PICKER (tiếng Việt)
let calState = {year:0, month:0, selectedISO:'', onSelect:null};

function openCalendar(initialISO, onSelect){
  const d = initialISO ? new Date(initialISO+'T00:00:00') : new Date();
  calState = {year:d.getFullYear(), month:d.getMonth(), selectedISO:initialISO||'', onSelect};

  const overlay = document.createElement('div');
  overlay.className = 'cal-overlay';
  overlay.id = 'cal-overlay';
  overlay.innerHTML = `<div class="cal-modal" id="cal-modal"></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeCalendar(); });

  renderCalendar();
}
function closeCalendar(){
  const o = document.getElementById('cal-overlay');
  if(o) o.remove();
}
function renderCalendar(){
  const modal = document.getElementById('cal-modal');
  if(!modal) return;
  const {year, month} = calState;

  // year range: wide enough to cover many years of bookkeeping, centered on current selection
  const baseYear = new Date().getFullYear();
  const yearOptions = [];
  for(let y = baseYear-8; y <= baseYear+8; y++) yearOptions.push(y);
  if(!yearOptions.includes(year)) yearOptions.push(year);
  yearOptions.sort((a,b)=>a-b);

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay(); // 0 = CN
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const todayISO2 = todayISO();
  let cells = '';
  for(let i=0; i<startWeekday; i++){
    const day = daysInPrevMonth - startWeekday + 1 + i;
    cells += `<button type="button" class="cal-day other-month" disabled>${day}</button>`;
  }
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const cls = ['cal-day'];
    if(iso===todayISO2) cls.push('today');
    if(iso===calState.selectedISO) cls.push('selected');
    cells += `<button type="button" class="${cls.join(' ')}" data-iso="${iso}">${day}</button>`;
  }
  const totalCells = startWeekday + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=1; i<=trailing; i++){
    cells += `<button type="button" class="cal-day other-month" disabled>${i}</button>`;
  }

  modal.innerHTML = `
    <div class="cal-head">
      <button type="button" class="cal-nav-btn" id="cal-prev">‹</button>
      <select id="cal-month-select">${VI_MONTHS.map((m,i)=>`<option value="${i}" ${i===month?'selected':''}>${m}</option>`).join('')}</select>
      <select id="cal-year-select">${yearOptions.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>
      <button type="button" class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <div class="cal-weekdays">${VI_WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="cal-days">${cells}</div>
    <div class="cal-footer">
      <button type="button" class="btn-secondary" id="cal-today">Hôm nay</button>
      <button type="button" class="btn-secondary" id="cal-close">Đóng</button>
    </div>
  `;

  document.getElementById('cal-prev').onclick = ()=>{
    calState.month--; if(calState.month<0){calState.month=11; calState.year--;} renderCalendar();
  };
  document.getElementById('cal-next').onclick = ()=>{
    calState.month++; if(calState.month>11){calState.month=0; calState.year++;} renderCalendar();
  };
  document.getElementById('cal-month-select').onchange = e=>{ calState.month = Number(e.target.value); renderCalendar(); };
  document.getElementById('cal-year-select').onchange = e=>{ calState.year = Number(e.target.value); renderCalendar(); };
  document.getElementById('cal-today').onclick = ()=>{
    const iso = todayISO();
    calState.onSelect(iso);
    closeCalendar();
  };
  document.getElementById('cal-close').onclick = closeCalendar;
  modal.querySelectorAll('.cal-day[data-iso]').forEach(btn=>{
    btn.onclick = ()=>{ calState.onSelect(btn.dataset.iso); closeCalendar(); };
  });
}
function formatDateVN(iso){
  if(!iso) return 'Chọn ngày';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function calendarIconSvg(){
  return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
}

function renderTxnList(){
  const list = document.getElementById('txn-list');
  if(!list) return;
  const typeF = document.getElementById('filter-type').value;
  const monthF = document.getElementById('filter-month').value; // "1".."12" or "all"
  const yearF = document.getElementById('filter-year').value;   // "2026" or "all"

  let items = state.transactions.slice().sort((a,b)=> b.date.localeCompare(a.date));
  if(typeF!=='all') items = items.filter(t=>t.type===typeF);
  if(monthF!=='all') items = items.filter(t=>monthYear(t.date).m===Number(monthF));
  if(yearF!=='all') items = items.filter(t=>monthYear(t.date).y===Number(yearF));

  if(items.length===0){
    list.innerHTML = `<div class="empty">Không có giao dịch nào phù hợp.</div>`;
    return;
  }

  list.innerHTML = items.map(t=>`
    <div class="txn ${t.type==='Chi'?'chi':''}">
      <div class="txn-main">
        <div class="txn-desc">${escapeHtml(t.desc)}</div>
        <div class="txn-meta">${formatDate(t.date)}${isFutureDate(t.date)?' <span style="color:#9C7A1E;font-weight:700;">⚠ tương lai</span>':''} · ${escapeHtml(t.category)}${t.supplier? ' · '+escapeHtml(t.supplier):''}</div>
      </div>
      <div class="txn-amt ${t.type==='Chi'?'chi':'thu'}">${t.type==='Chi'?'-':'+'}${money(t.amount)}</div>
      <div class="txn-actions">
        <button class="icon-btn" title="Sửa" data-edit="${t.id}">${icon('edit')}</button>

      </div>
    </div>
  `).join('');

  list.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=>{ editingId = b.dataset.edit; activeTab='log'; render(); window.scrollTo({top:0,behavior:'smooth'}); };

        state.transactions = state.transactions.filter(t=>t.id!==b.dataset.del);
        saveState();
        renderTxnList();
        // refresh ticket header totals
        render();
      }
    };
  });

function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function icon(name){
  if(name==='edit') return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  if(name==='trash') return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>`;
  return '';
}

// ---------------------------------------------------------------- OVERVIEW TAB (charts)
function pct(v, total){ return total>0 ? Math.round(v/total*100) : 0; }
function abbrevMillions(n){
  const v = Number(n||0)/1e6;
  const rounded = Math.round(v*10)/10;
  const str = Math.abs(rounded % 1) < 0.001 ? rounded.toFixed(0) : rounded.toFixed(1);
  return `${str}tr`;
}

function renderDonutSVG(thu, chi, size){
  size = size || 150;
  const strokeW = 18;
  const r = size/2 - strokeW/2 - 2;
  const cx = size/2, cy = size/2;
  const circumference = 2*Math.PI*r;
  const total = thu + chi;
  const thuFrac = total>0 ? thu/total : 0;
  const chiFrac = total>0 ? chi/total : 0;
  const thuLen = circumference*thuFrac;
  const chiLen = circumference*chiFrac;
  const net = thu - chi;

  if(total<=0){
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EDEAE0" stroke-width="${strokeW}"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" font-size="12" fill="#8A8578">Chưa có dữ liệu</text>
    </svg>`;
  }

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EDEAE0" stroke-width="${strokeW}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2F7D4F" stroke-width="${strokeW}"
      stroke-dasharray="${thuLen} ${circumference-thuLen}" stroke-dashoffset="0"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#B54834" stroke-width="${strokeW}"
      stroke-dasharray="${chiLen} ${circumference-chiLen}" stroke-dashoffset="${-thuLen}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="15" fill="${net<0?'#B54834':'#2F7D4F'}">${net<0?'-':''}${abbrevMillions(Math.abs(net))}</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#4A5568">chênh lệch</text>
  </svg>`;
}

function renderDonutCard(title, thu, chi){
  const total = thu + chi;
  const net = thu - chi;
  return `
    <div class="card">
      <h2>${title}</h2>
      <div class="donut-row">
        ${renderDonutSVG(thu, chi)}
        <div class="donut-legend">
          <div class="legend-item"><span class="dot thu"></span>Thu <strong>${pct(thu,total)}%</strong> — ${abbrevMillions(thu)}</div>
          <div class="legend-item"><span class="dot chi"></span>Chi <strong>${pct(chi,total)}%</strong> — ${abbrevMillions(chi)}</div>
          <div class="legend-item net"><strong>Chênh lệch: ${net<0?'-':''}${abbrevMillions(Math.abs(net))}</strong></div>
        </div>
      </div>
    </div>
  `;
}

function renderOverview(){
  const panel = document.getElementById('panel-overview');
  const now = new Date();
  const year = now.getFullYear();
  const curMonth = now.getMonth()+1;
  const ct = currentMonthTotals();
  const cy = currentYearTotals();

  const months = Array.from({length:12}, (_,i)=>i+1);
  const rows = months.map(m=>{
    let thu=0, chi=0;
    state.transactions.forEach(t=>{
      const my = monthYear(t.date);
      if(my.y===year && my.m===m){ if(t.type==='Thu') thu+=Number(t.amount); else chi+=Number(t.amount); }
    });
    return {m, thu, chi};
  });
  const BAR_MAX_PX = 130;
  const maxVal = Math.max(1, ...rows.flatMap(r=>[r.thu, r.chi, Math.abs(r.thu-r.chi)]));

  const colChart = rows.map(r=>{
    const net = r.thu - r.chi;
    const hThu = r.thu>0 ? Math.max(3, Math.round(r.thu/maxVal*BAR_MAX_PX)) : 0;
    const hChi = r.chi>0 ? Math.max(3, Math.round(r.chi/maxVal*BAR_MAX_PX)) : 0;
    const hNet = net!==0 ? Math.max(3, Math.round(Math.abs(net)/maxVal*BAR_MAX_PX)) : 0;
    const netColor = net<0 ? 'var(--chi)' : 'var(--thu)';
    return `
      <div class="col-month ${r.m===curMonth?'current':''}">
        <div class="col-bars">
          <div class="col-bar-wrap">
            <div class="col-bar-label">${r.thu>0?abbrevMillions(r.thu):''}</div>
            <div class="col-bar thu" style="height:${hThu}px"></div>
          </div>
          <div class="col-bar-wrap">
            <div class="col-bar-label">${r.chi>0?abbrevMillions(r.chi):''}</div>
            <div class="col-bar chi" style="height:${hChi}px"></div>
          </div>
          <div class="col-bar-wrap">
            <div class="col-bar-label" style="color:${netColor}">${net!==0?(net<0?'-':'')+abbrevMillions(Math.abs(net)):''}</div>
            <div class="col-bar net" style="height:${hNet}px"></div>
          </div>
        </div>
        <div class="col-month-label">Th${r.m}${r.m===curMonth?' •':''}</div>
      </div>
    `;
  }).join('');

  panel.innerHTML = `
    <div class="grid-2">
      ${renderDonutCard(`Tỉ lệ Thu/Chi tháng ${curMonth}/${year}`, ct.thu, ct.chi)}
      ${renderDonutCard(`Tỉ lệ Thu/Chi cả năm ${year}`, cy.thu, cy.chi)}
    </div>

    <div class="card">
      <h2>Biểu đồ Thu/Chi/Chênh lệch theo tháng — ${year}</h2>
      <p class="muted" style="margin-top:0;">Tháng hiện tại (Th${curMonth}) được tô nổi bật. Đơn vị: triệu đồng (tr).</p>
      <div class="col-chart-legend">
        <span class="legend-item"><span class="dot thu"></span>Thu</span>
        <span class="legend-item"><span class="dot chi"></span>Chi</span>
        <span class="legend-item"><span class="dot net"></span>Chênh lệch</span>
      </div>
      <div class="col-chart">${colChart}</div>
    </div>
  `;
}

function renderSummary(){
  const panel = document.getElementById('panel-summary');
  const years = allYears();
  const selectedYear = Number(panel.dataset.year || years[0]);

  const months = Array.from({length:12}, (_,i)=>i+1);
  let cum = 0;
  const rows = months.map(m=>{
    let thu=0, chi=0;
    state.transactions.forEach(t=>{
      const my = monthYear(t.date);
      if(my.y===selectedYear && my.m===m){
        if(t.type==='Thu') thu+=Number(t.amount); else chi+=Number(t.amount);
      }
    });
    const net = thu-chi;
    cum += net;
    return {m, thu, chi, net, cum};
  });
  const totalThu = rows.reduce((s,r)=>s+r.thu,0);
  const totalChi = rows.reduce((s,r)=>s+r.chi,0);
  const maxVal = Math.max(1, ...rows.map(r=>Math.max(r.thu,r.chi)));

  const yearlyOverview = years.map(y=>{
    let thu=0, chi=0;
    state.transactions.forEach(t=>{
      if(monthYear(t.date).y===y){ if(t.type==='Thu') thu+=Number(t.amount); else chi+=Number(t.amount); }
    });
    return {y, thu, chi, net:thu-chi};
  });

  panel.innerHTML = `
    ${years.length>1 ? `
    <div class="card">
      <h2>So sánh nhiều năm</h2>
      <table>
        <thead><tr><th>Năm</th><th>Tổng Thu</th><th>Tổng Chi</th><th>Lợi nhuận</th></tr></thead>
        <tbody>
          ${yearlyOverview.map(r=>`<tr><td>${r.y}</td><td>${money(r.thu)}</td><td>${money(r.chi)}</td><td style="color:${r.net<0?'var(--chi)':'var(--thu)'}">${r.net<0?'-':''}${money(Math.abs(r.net))}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>` : ''}

    <div class="card">
      <h2>Chi tiết theo tháng</h2>
      <div class="ticket-row" style="margin-bottom:10px;">
        <label style="margin:0;">Năm</label>
        <select id="year-select">${years.map(y=>`<option ${y===selectedYear?'selected':''}>${y}</option>`).join('')}</select>
      </div>
      ${rows.map(r=>`
        <div class="bar-row">
          <div class="bar-label">Tháng ${r.m}</div>
          <div class="bar-track"><div class="bar-fill thu" style="width:${(r.thu/maxVal*100).toFixed(1)}%"></div></div>
          <div style="width:80px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--thu);">${money(r.thu)}</div>
        </div>
        <div class="bar-row">
          <div class="bar-label"></div>
          <div class="bar-track"><div class="bar-fill chi" style="width:${(r.chi/maxVal*100).toFixed(1)}%"></div></div>
          <div style="width:80px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--chi);">${money(r.chi)}</div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Bảng chi tiết ${selectedYear}</h2>
      <table>
        <thead><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Chênh lệch</th><th>Lũy kế</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr><td>Tháng ${r.m}</td><td>${money(r.thu)}</td><td>${money(r.chi)}</td><td style="color:${r.net<0?'var(--chi)':'var(--thu)'}">${r.net<0?'-':''}${money(Math.abs(r.net))}</td><td>${r.cum<0?'-':''}${money(Math.abs(r.cum))}</td></tr>`).join('')}
          <tr class="total-row"><td>Tổng cả năm</td><td>${money(totalThu)}</td><td>${money(totalChi)}</td><td>${(totalThu-totalChi)<0?'-':''}${money(Math.abs(totalThu-totalChi))}</td><td>${cum<0?'-':''}${money(Math.abs(cum))}</td></tr>
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('year-select').onchange = (e)=>{ panel.dataset.year = e.target.value; renderSummary(); };
}

// ---------------------------------------------------------------- SUPPLIERS TAB
function renderSuppliers(){
  const panel = document.getElementById('panel-suppliers');
  const years = ['Tất cả năm', ...allYears()];
  const selectedYear = panel.dataset.year || 'Tất cả năm';

  const data = state.suppliers.map(s=>{
    const txns = state.transactions.filter(t=>t.type==='Chi' && t.supplier===s &&
      (selectedYear==='Tất cả năm' || monthYear(t.date).y===Number(selectedYear)));
    const total = txns.reduce((sum,t)=>sum+Number(t.amount),0);
    const count = txns.length;
    const last = txns.length? txns.map(t=>t.date).sort().slice(-1)[0] : null;
    const minAmount = txns.length? Math.min(...txns.map(t=>Number(t.amount))) : null;
    const maxAmount = txns.length? Math.max(...txns.map(t=>Number(t.amount))) : null;
    return {supplier:s, total, count, avg: count? total/count : 0, last, minAmount, maxAmount};
  }).sort((a,b)=>b.total-a.total);

  const grandTotal = data.reduce((s,d)=>s+d.total,0);
  const maxTotal = Math.max(1, ...data.map(d=>d.total));

  panel.innerHTML = `
    <div class="card">
      <h2>Chi theo nhà cung cấp</h2>
      <div class="ticket-row" style="margin-bottom:10px;">
        <label style="margin:0;">Năm</label>
        <select id="ncc-year">${years.map(y=>`<option ${String(y)===String(selectedYear)?'selected':''}>${y}</option>`).join('')}</select>
      </div>
      ${data.map(d=>`
        <div class="bar-row">
          <div class="bar-label" style="width:110px;">${escapeHtml(d.supplier)}</div>
          <div class="bar-track"><div class="bar-fill chi" style="width:${(d.total/maxTotal*100).toFixed(1)}%"></div></div>
          <div style="width:90px;text-align:right;font-family:'IBM Plex Mono',monospace;">${money(d.total)}</div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Bảng chi tiết</h2>
      <div class="table-scroll">
      <table>
        <thead><tr><th>Nhà cung cấp</th><th>Tổng chi</th><th>Số lần</th><th>TB/lần</th><th>Lần nhập gần nhất</th><th>Lần chi ít nhất</th><th>Lần chi nhiều nhất</th></tr></thead>
        <tbody>
          ${data.map(d=>`
            <tr class="${d.total===maxTotal && d.total>0 ? 'max-row':''}">
              <td>${escapeHtml(d.supplier)}</td>
              <td>${money(d.total)}</td>
              <td style="text-align:center;">${d.count}</td>
              <td>${money(d.avg)}</td>
              <td>${d.last? formatDate(d.last) : '—'}</td>
              <td>${d.minAmount!==null? money(d.minAmount) : '—'}</td>
              <td>${d.maxAmount!==null? money(d.maxAmount) : '—'}</td>
            </tr>`).join('')}
          <tr class="total-row"><td>Tổng cộng</td><td>${money(grandTotal)}</td><td style="text-align:center;">${data.reduce((s,d)=>s+d.count,0)}</td><td></td><td></td><td></td><td></td></tr>
        </tbody>
      </table>
      </div>
      <p class="muted">Dòng tô đậm là nhà cung cấp đang chiếm chi phí nhập hàng nhiều nhất. "Lần chi ít nhất/nhiều nhất" tính theo từng lần nhập hàng riêng lẻ, không phải tổng cộng.</p>
    </div>
  `;
  document.getElementById('ncc-year').onchange = (e)=>{ panel.dataset.year = e.target.value; renderSuppliers(); };
}

// ---------------------------------------------------------------- CATEGORIES TAB
function renderCategories(){
  const panel = document.getElementById('panel-categories');
  panel.innerHTML = `
    <div class="card">
      <h2>Danh mục Thu</h2>
      <div class="chip-list" id="chips-thu"></div>
      <div class="add-row">
        <input type="text" id="new-thu" placeholder="Thêm danh mục thu mới...">
        <button class="btn-secondary" id="add-thu">Thêm</button>
      </div>
    </div>
    <div class="card">
      <h2>Danh mục Chi</h2>
      <div class="chip-list" id="chips-chi"></div>
      <div class="add-row">
        <input type="text" id="new-chi" placeholder="Thêm danh mục chi mới...">
        <button class="btn-secondary" id="add-chi">Thêm</button>
      </div>
    </div>
    <div class="card">
      <h2>Nhà cung cấp / Mối sỉ</h2>
      <div class="chip-list" id="chips-supplier"></div>
      <div class="add-row">
        <input type="text" id="new-supplier" placeholder="Thêm nhà cung cấp mới...">
        <button class="btn-secondary" id="add-supplier">Thêm</button>
      </div>
    </div>
    <div class="card">
      <h2>Dữ liệu</h2>
      <p class="muted">Dữ liệu được lưu tự động ngay trên trình duyệt bạn đang dùng để mở file này. Vì dùng cho nhiều năm, bạn nên sao lưu định kỳ (vd: cuối mỗi tháng) — phòng khi đổi máy, đổi trình duyệt, hoặc xoá lịch sử duyệt web.</p>

      <p class="muted" style="margin-top:0;"><strong>Excel (.xlsx)</strong> — cùng cấu trúc cột với file Excel shop đang dùng, tiện xem/chỉnh bằng Excel hoặc Google Sheets:</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
        <button class="btn-secondary" id="export-excel">⬇ Xuất Excel (.xlsx)</button>
        <button class="btn-secondary" id="import-excel">⬆ Nhập từ Excel (.xlsx)</button>
        <input type="file" id="import-excel-file" accept=".xlsx,.xls" style="display:none;">
      </div>

      <p class="muted" style="margin-top:0;"><strong>JSON</strong> — sao lưu/khôi phục đầy đủ (gồm cả danh mục, nhà cung cấp):</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
        <button class="btn-secondary" id="export-data">⬇ Xuất dữ liệu (JSON)</button>
        <button class="btn-secondary" id="import-data">⬆ Nhập dữ liệu (JSON)</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;">
      </div>
      <button class="btn-secondary" id="reset-data" style="color:var(--chi);border-color:var(--chi);">Xoá toàn bộ dữ liệu</button>
    </div>
  `;

  const renderChips = (key, listArr, containerId) => {
    const c = document.getElementById(containerId);
    c.innerHTML = listArr.map(v=>`<span class="chip">${escapeHtml(v)} <button data-remove="${escapeHtml(v)}">✕</button></span>`).join('') || '<span class="muted">Chưa có mục nào</span>';
    c.querySelectorAll('[data-remove]').forEach(b=>{
      b.onclick = ()=>{
        if(key==='supplier'){
          state.suppliers = state.suppliers.filter(x=>x!==b.dataset.remove);
        }else{
          state.categories[key] = state.categories[key].filter(x=>x!==b.dataset.remove);
        }
        saveState();
        renderCategories();
      };
    });
  };
  renderChips('Thu', state.categories.Thu, 'chips-thu');
  renderChips('Chi', state.categories.Chi, 'chips-chi');
  renderChips('supplier', state.suppliers, 'chips-supplier');

  document.getElementById('add-thu').onclick = ()=>{
    const v = document.getElementById('new-thu').value.trim();
    if(v && !state.categories.Thu.includes(v)){ state.categories.Thu.push(v); saveState(); renderCategories(); }
  };
  document.getElementById('add-chi').onclick = ()=>{
    const v = document.getElementById('new-chi').value.trim();
    if(v && !state.categories.Chi.includes(v)){ state.categories.Chi.push(v); saveState(); renderCategories(); }
  };
  document.getElementById('add-supplier').onclick = ()=>{
    const v = document.getElementById('new-supplier').value.trim();
    if(v && !state.suppliers.includes(v)){ state.suppliers.push(v); saveState(); renderCategories(); }
  };
  document.getElementById('export-excel').onclick = exportExcel;
  document.getElementById('import-excel').onclick = ()=>{
    document.getElementById('import-excel-file').click();
  };
  document.getElementById('import-excel-file').onchange = (e)=>{
    const file = e.target.files[0];
    if(file) importExcelFile(file);
    e.target.value = '';
  };

  document.getElementById('export-data').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `so-thu-chi-sao-luu-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Đã xuất file sao lưu');
  };
  document.getElementById('import-data').onclick = ()=>{
    document.getElementById('import-file').click();
  };
  document.getElementById('import-file').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.transactions || !parsed.categories || !parsed.suppliers){
          throw new Error('invalid shape');
        }
        if(confirm('Nhập dữ liệu từ file này sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Tiếp tục?')){
          state = parsed;
          saveState();
          render();
          showToast('Đã khôi phục dữ liệu từ file');
        }
      }catch(err){
        alert('File không hợp lệ. Vui lòng chọn đúng file sao lưu đã xuất từ app này.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  };
  document.getElementById('reset-data').onclick = ()=>{
    if(confirm('Xoá toàn bộ giao dịch, danh mục và nhà cung cấp? Hành động này không thể hoàn tác.')){
      state = deepClone(DEFAULT_STATE);
      state.transactions = [];
      saveState();
      render();
    }
  };
}

loadState().catch(()=>{ state = deepClone(DEFAULT_STATE); render(); });
setInterval(()=>{
  const el = document.getElementById('live-clock');
  if(el) el.textContent = formatTimeVN(new Date());
}, 1000);
window.addEventListener('unhandledrejection', (e)=>{
  e.preventDefault();
  showToast('Không lưu được dữ liệu trên trình duyệt này — hãy dùng nút "Xuất dữ liệu" để sao lưu thủ công');
});
</script>
</body>
</html>
